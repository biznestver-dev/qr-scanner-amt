<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Техотдел AM — Учет оборудования (МТБ)</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% -20%, #1a0836 0%, #090c15 50%, #04060a 100%);
      --glass-bg: rgba(15, 21, 38, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --am-purple: #3b26a6;
      --am-magenta: #ff0043;
      --am-cyan: #00f0ff;
      --accent-gradient: linear-gradient(135deg, #ff0043 0%, #7000ff 50%, #3b26a6 100%);
      --accent-glow: rgba(255, 0, 67, 0.35);
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --status-free: #10b981;
      --status-free-bg: rgba(16, 185, 129, 0.15);
      --status-busy: #ff2a6d;
      --status-busy-bg: rgba(255, 42, 109, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-attachment: fixed;
    }
    .container {
      width: 100%;
      max-width: 940px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), 0 0 100px rgba(112, 0, 255, 0.15);
      position: relative;
    }
    .container::before {
      content: '';
      position: absolute;
      top: -2px; left: 15%; right: 15%; height: 2px;
      background: var(--accent-gradient);
      border-radius: 2px;
    }
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--glass-border);
    }
    .app-title { display: flex; align-items: center; gap: 18px; }
    .app-logo { width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .app-logo svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 16px rgba(255, 0, 67, 0.4)); }
    .app-title-text h2 {
      font-size: 24px; font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .app-title-text p { font-size: 13px; color: var(--am-cyan); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
    #reader {
      width: 100%; max-width: 480px; margin: 0 auto 32px auto; border-radius: 20px; overflow: hidden;
      border: 1px dashed rgba(0, 240, 255, 0.3); background: rgba(9, 12, 21, 0.8);
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    @media (max-width: 680px) { .form-grid { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: 1 / -1; }
    label { font-size: 11px; font-weight: 800; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
    input[type="text"], input[type="date"], select, textarea {
      width: 100%; padding: 15px 18px; background: rgba(9, 12, 21, 0.7);
      border: 1px solid var(--glass-border); border-radius: 14px; color: var(--text-primary); font-size: 14px; font-family: inherit;
    }
    .inv-input-group { display: flex; gap: 10px; }
    .db-quick-btn, .add-quick-btn {
      height: 52px; min-width: 140px; padding: 0 16px; border-radius: 14px; cursor: pointer;
      font-size: 12px; font-weight: 800; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .db-quick-btn { background: rgba(59, 38, 166, 0.5); border: 1px solid rgba(0, 240, 255, 0.3); color: var(--am-cyan); }
    .add-quick-btn { background: var(--accent-gradient); border: none; color: #fff; box-shadow: 0 4px 15px var(--accent-glow); }
    .phone-input-group { display: flex; gap: 10px; }
    .phone-country-select { width: 115px !important; flex-shrink: 0; font-size: 13px; padding: 15px 10px; cursor: pointer; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--am-magenta); background: rgba(15, 21, 38, 0.95); }
    input#inv-input { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--am-cyan); }
    select option { background-color: #090c15; color: var(--text-primary); }
    .selected-items-list { grid-column: 1 / -1; background: rgba(9, 12, 21, 0.5); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; margin-top: 10px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(25, 34, 60, 0.5); border: 1px solid var(--glass-border); border-radius: 12px; margin-bottom: 10px; }
    .control-panels-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 32px; }
    @media (max-width: 768px) { .control-panels-wrapper { grid-template-columns: 1fr; } }
    .control-panel-column { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      width: 100%; background: rgba(112, 0, 255, 0.15); color: var(--text-primary); padding: 16px 18px;
      border: 1px solid rgba(112, 0, 255, 0.4); border-radius: 14px; cursor: pointer; font-size: 12px; font-weight: 800;
      text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.25s ease;
    }
    .btn:hover { background: var(--accent-gradient); color: white; border-color: transparent; }
    .btn-act-row { display: flex; gap: 12px; }
    .btn-callsheet { background: rgba(0, 240, 255, 0.12); border-color: rgba(0, 240, 255, 0.4); color: var(--am-cyan); }
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(4, 6, 10, 0.9); backdrop-filter: blur(16px); z-index: 1000; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-content {
      background: #090c15; border: 1px solid var(--glass-border); width: 100%; max-width: 1080px; max-height: 88vh;
      border-radius: 28px; padding: 32px; display: flex; flex-direction: column; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-header h3 { font-size: 20px; font-weight: 800; color: var(--text-primary); text-transform: uppercase; }
    .modal-actions { display: flex; align-items: center; gap: 12px; }
    .close-btn { font-size: 22px; cursor: pointer; border: none; background: rgba(255,255,255,0.05); color: var(--text-secondary); width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .table-wrapper { overflow-y: auto; flex: 1; border: 1px solid var(--glass-border); border-radius: 16px; }
    table.db-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
    table.db-table th, table.db-table td { padding: 16px 18px; border-bottom: 1px solid var(--glass-border); }
    table.db-table th { background: #0f1526; color: var(--text-secondary); position: sticky; top: 0; font-weight: 800; font-size: 11px; text-transform: uppercase; }
    .select-btn, .return-btn, .delete-btn, .export-btn, .add-row-btn {
      padding: 8px 14px; font-size: 12px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .select-btn { background: var(--am-purple); color: white; }
    .return-btn { background: var(--status-free); color: white; }
    .delete-btn { background: var(--status-busy); color: white; }
    .export-btn { background: #00b4d8; color: white; }
    .add-row-btn { background: rgba(0, 240, 255, 0.2); color: var(--am-cyan); border: 1px solid rgba(0, 240, 255, 0.4); }
    .cs-section { background: rgba(9, 12, 21, 0.6); border: 1px solid var(--glass-border); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
    .cs-section-title { font-size: 12px; font-weight: 800; color: var(--am-cyan); text-transform: uppercase; margin-bottom: 12px; }
    #act-print-area, #callsheet-print-area { display: none; }
    @media print {
      @page { size: A4 landscape !important; margin: 3mm 4mm !important; }
      body { background: #fff !important; color: #000 !important; }
      .container, .modal, #reader, .form-grid, .control-panels-wrapper, .app-header { display: none !important; }
      #act-print-area.active-print { display: block !important; width: 100% !important; color: #000 !important; }
      #callsheet-print-area.active-print { display: block !important; width: 100% !important; color: #000 !important; font-size: 7.5pt !important; }
      table.act-table { width: 100% !important; border-collapse: collapse !important; margin-bottom: 5px !important; }
      table.act-table th, table.act-table td { border: 1px solid #000 !important; padding: 2px 4px !important; font-size: 7.5pt !important; text-align: center; }
      table.act-table th { background-color: #f2f2f2 !important; }
      .safety-rules-wrapper { display: none; }
      .safety-rules-wrapper.active { display: block !important; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="app-header">
      <div class="app-title">
        <div class="app-logo">
          <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M142.5 450.5C52.5 410.5 25.5 305.5 65.5 215.5C105.5 125.5 210.5 98.5 300.5 138.5C390.5 178.5 486.5 244.5 446.5 334.5C406.5 424.5 232.5 490.5 142.5 450.5Z" fill="#FF0043"/>
            <path d="M178.5 385.5C123.5 360.5 106.5 295.5 131.5 240.5C156.5 185.5 221.5 168.5 276.5 193.5C331.5 218.5 383.5 260.5 358.5 315.5C333.5 370.5 233.5 410.5 178.5 385.5Z" fill="#FFFFFF"/>
            <path d="M205.5 340.5C185.5 331.5 178.5 307.5 187.5 287.5C196.5 267.5 220.5 260.5 240.5 269.5C260.5 278.5 282.5 292.5 273.5 312.5C264.5 332.5 225.5 349.5 205.5 340.5Z" fill="#3B26A6"/>
          </svg>
        </div>
        <div class="app-title-text">
          <h2>Техотдел AM</h2>
          <p>Учет оборудования (МТБ)</p>
        </div>
      </div>
    </div>

    <div id="reader"></div>

    <div class="form-grid">
      <div class="form-group">
        <label for="inv-input">Инвентарный номер (QR / Штрихкод)</label>
        <div class="inv-input-group">
          <input type="text" id="inv-input" placeholder="Сканируйте или введите..." oninput="onInventoryChange(this.value)">
          <div id="inv-action-btn-container">
            <button class="db-quick-btn" onclick="openDbModal()">📋 База МТБ</button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="equipment-name">Наименование оборудования</label>
        <input type="text" id="equipment-name" placeholder="Автоматически из базы...">
      </div>

      <div class="form-group">
        <label for="competence-select" id="competence-label">Компетенция</label>
        <select id="competence-select">
          <option value="моушн-дизайнер" class="comp-opt">моушн-дизайнер</option>
          <option value="веб-дизайнер (UX/UI)" class="comp-opt">веб-дизайнер (UX/UI)</option>
          <option value="оператор кино и ТВ" class="comp-opt">оператор кино и ТВ</option>
          <option value="звукорежиссёр (FOH)" class="comp-opt">звукорежиссёр (FOH)</option>
          <option value="Офис" id="office-option" style="display: none;">Офис</option>
        </select>
      </div>

      <div class="form-group">
        <label for="manager-select">Административно-технический отдел</label>
        <select id="manager-select">
          <option value="Зломанов Олег Викторович">Зломанов Олег Викторович</option>
          <option value="Смутный Богдан Сергеевич">Смутный Богдан Сергеевич</option>
          <option value="Белоусов Алексей Алексеевич">Белоусов Алексей Алексеевич</option>
        </select>
      </div>

      <div class="form-group">
        <label for="recipient-role-select">Роль получателя</label>
        <select id="recipient-role-select" onchange="onRoleChange(this.value)">
          <option value="Участник">Участник</option>
          <option value="Сотрудник">Сотрудник</option>
          <option value="Менеджер компетенции">Менеджер компетенции</option>
        </select>
      </div>

      <div class="form-group">
        <label for="participant-name" id="participant-label">ФИО Участника</label>
        <div id="participant-container">
          <input type="text" id="participant-name" placeholder="Введите ФИО участника...">
        </div>
      </div>

      <div class="form-group">
        <label for="contact-input">Телефон / Telegram / MAX</label>
        <div class="phone-input-group">
          <select id="country-code-select" class="phone-country-select">
            <option value="+7">🇷🇺 +7</option>
            <option value="other">🌐 Другой</option>
          </select>
          <input type="text" id="contact-input" placeholder="900 000 00 00..." oninput="formatPhoneNumber(this)">
        </div>
      </div>

      <div class="form-group" id="return-date-group">
        <label for="return-date-input">Планируемая дата возврата</label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="date" id="return-date-input" style="flex: 1;">
          <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; margin-bottom: 0;">
            <input type="checkbox" id="no-return-date-checkbox" onchange="toggleNoReturnDate(this.checked)" style="width: 16px; height: 16px; cursor: pointer;"> — (Прочерк)
          </label>
        </div>
      </div>

      <div class="form-group full-width">
        <label for="comment-input">Комментарии</label>
        <textarea id="comment-input" rows="2" placeholder="Комплектация, состояние и т.д."></textarea>
      </div>

      <div class="selected-items-list full-width">
        <h4>Выбранное оборудование для выдачи (<span id="items-count">0</span>)</h4>
        <div id="selected-items-container">
          <p style="font-size: 13px; color: var(--text-muted);">Сканируйте QR или введите инвентарный номер и нажмите кнопку выше</p>
        </div>
      </div>
    </div>

    <!-- БЛОК УПРАВЛЕНИЯ -->
    <div class="control-panels-wrapper">
      <div class="control-panel-column">
        <div class="btn-act-row">
          <button class="btn" onclick="generateAndPrintAct()">🖨️ Напечатать акт</button>
          <button class="btn" onclick="downloadActWord()">📥 Скачать акт</button>
        </div>
        <button class="btn" onclick="openHistoryModal()">📜 Архив актов</button>
      </div>

      <div class="control-panel-column">
        <button class="btn btn-callsheet" onclick="openCallSheetModal()">📋 Создать вызывной лист</button>
        <button class="btn btn-callsheet" onclick="openCallSheetHistoryModal()">📜 Архив вызывных листов</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНЫЕ ОКНА -->
  <div id="callSheetModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>КОНСТРУКТОР ВЫЗЫВНОГО ЛИСТА</h3>
        <button class="close-btn" onclick="closeCallSheetModal()">&times;</button>
      </div>
      <div class="table-wrapper" style="padding: 15px;">
        <div class="cs-section">
          <div class="cs-section-title">Основная информация</div>
          <div class="form-grid">
            <div class="form-group"><label>Проект</label><input type="text" id="cs-project-name" value="ArtMasters — Смена"></div>
            <div class="form-group"><label>Дата смены</label><input type="date" id="cs-date"></div>
          </div>
        </div>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 15px;">
        <button class="btn" onclick="closeCallSheetModal()" style="max-width: 150px; background: #333;">Закрыть</button>
        <button class="btn" onclick="printCallSheet()" style="max-width: 200px; background: var(--accent-gradient);">Печать / PDF</button>
      </div>
    </div>
  </div>

  <div id="dbModal" class="modal">
    <div class="modal-content">
      <div class="modal-header"><h3>База МТБ</h3><button class="close-btn" onclick="closeDbModal()">&times;</button></div>
      <div class="table-wrapper"><table class="db-table"><tbody id="dbTableBody"></tbody></table></div>
    </div>
  </div>

  <div id="historyModal" class="modal">
    <div class="modal-content">
      <div class="modal-header"><h3>Архив актов</h3><button class="close-btn" onclick="closeHistoryModal()">&times;</button></div>
      <div class="table-wrapper"><table class="db-table"><tbody id="historyTableBody"></tbody></table></div>
    </div>
  </div>

  <div id="csHistoryModal" class="modal">
    <div class="modal-content">
      <div class="modal-header"><h3>Архив вызывных</h3><button class="close-btn" onclick="closeCallSheetHistoryModal()">&times;</button></div>
      <div class="table-wrapper"><table class="db-table"><tbody id="csHistoryTableBody"></tbody></table></div>
    </div>
  </div>

  <div id="callsheet-print-area"></div>
  <div id="act-print-area">
    <div class="act-header">АНО «АртМастерс»</div>
    <table class="act-table"><tbody id="print-table-tbody"></tbody></table>
    <div id="safety-rules-wrapper" class="safety-rules-wrapper"></div>
  </div>

  <!-- СКРИПТЫ -->
  <script>
    if (!window.EQUIPMENT_DB) {
      window.EQUIPMENT_DB = {
        "1": { inv: "AM-001", category: "Ноутбуки", name: "MacBook Pro 16", sn: "MB12345", status: "В офисе" },
        "2": { inv: "AM-002", category: "Звук", name: "Yamaha QL5", sn: "YM98765", status: "В офисе" }
      };
    }
    function findEquipment(inv) {
      return Object.values(window.EQUIPMENT_DB).find(e => e.inv === inv);
    }

    var globalActItems = [];

    function openCallSheetModal() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const dateEl = document.getElementById('cs-date');
      if (dateEl) dateEl.value = `${year}-${month}-${day}`;
      document.getElementById('callSheetModal').style.display = 'flex';
    }
    function closeCallSheetModal() {
      document.getElementById('callSheetModal').style.display = 'none';
    }

    function openDbModal() {
      renderDbTable();
      document.getElementById('dbModal').style.display = 'flex';
    }
    function closeDbModal() { document.getElementById('dbModal').style.display = 'none'; }

    function openHistoryModal() {
      renderHistoryTable();
      document.getElementById('historyModal').style.display = 'flex';
    }
    function closeHistoryModal() { document.getElementById('historyModal').style.display = 'none'; }

    function openCallSheetHistoryModal() {
      document.getElementById('csHistoryModal').style.display = 'flex';
    }
    function closeCallSheetHistoryModal() { document.getElementById('csHistoryModal').style.display = 'none'; }

    function formatPhoneNumberStr(rawPhone) {
      if (!rawPhone) return '';
      const digits = String(rawPhone).replace(/\D/g, '');
      if (!digits) return rawPhone;
      let cleanDigits = digits.startsWith('7') || digits.startsWith('8') ? digits.substring(1) : digits;
      let formatted = '+7';
      if (cleanDigits.length > 0) formatted += ' ' + cleanDigits.substring(0, 3);
      if (cleanDigits.length >= 4) formatted += ' ' + cleanDigits.substring(3, 6);
      if (cleanDigits.length >= 7) formatted += ' ' + cleanDigits.substring(6, 8);
      if (cleanDigits.length >= 9) formatted += ' ' + cleanDigits.substring(8, 10);
      return formatted;
    }
    function formatPhoneNumber(input) { input.value = formatPhoneNumberStr(input.value); }
    function getFullContactValue() { return document.getElementById('contact-input').value.trim() || '—'; }
    function getParticipantValue() { const el = document.getElementById('participant-name'); return el ? el.value.trim() : ''; }
    
    function toggleNoReturnDate(checked) {
      const dateInput = document.getElementById('return-date-input');
      dateInput.value = '';
      dateInput.disabled = checked;
    }

    function updateInvActionButton() {
      const invVal = document.getElementById('inv-input').value.trim();
      const btnContainer = document.getElementById('inv-action-btn-container');
      if (invVal.length > 0) {
        btnContainer.innerHTML = `<button class="add-quick-btn" onclick="addItemToCurrentAct()">+ Добавить</button>`;
      } else {
        btnContainer.innerHTML = `<button class="db-quick-btn" onclick="openDbModal()">📋 База МТБ</button>`;
      }
    }

    function onInventoryChange(invVal) {
      updateInvActionButton();
      const found = findEquipment(invVal);
      if (found) document.getElementById('equipment-name').value = found.name;
    }

    function addItemToCurrentAct() {
      const inv = document.getElementById('inv-input').value.trim();
      const name = document.getElementById('equipment-name').value.trim();
      if (!inv || !name) { alert('Укажите инвентарный номер и наименование!'); return; }
      if (globalActItems.some(i => i.inv === inv)) { alert('Уже добавлено!'); return; }
      globalActItems.push({ inv, name });
      document.getElementById('inv-input').value = '';
      document.getElementById('equipment-name').value = '';
      updateInvActionButton();
      renderSelectedItems();
    }

    function removeItemFromAct(index) {
      globalActItems.splice(index, 1);
      renderSelectedItems();
    }

    function renderSelectedItems() {
      const container = document.getElementById('selected-items-container');
      document.getElementById('items-count').innerText = globalActItems.length;
      if (globalActItems.length === 0) {
        container.innerHTML = `<p style="font-size: 13px; color: var(--text-muted);">Сканируйте QR или введите инвентарный номер</p>`;
        return;
      }
      container.innerHTML = '';
      globalActItems.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `<div><b>${item.inv}</b> — ${item.name}</div><button class="delete-btn" onclick="removeItemFromAct(${index})">✕</button>`;
        container.appendChild(div);
      });
    }

    function renderDbTable() {
      const tbody = document.getElementById('dbTableBody');
      tbody.innerHTML = '';
      Object.values(window.EQUIPMENT_DB).forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><b>${item.inv}</b></td><td>${item.category}</td><td>${item.name}</td><td><button class="select-btn" onclick="selectEquipment('${item.inv}')">Выбрать</button></td>`;
        tbody.appendChild(tr);
      });
    }

    function selectEquipment(inv) {
      document.getElementById('inv-input').value = inv;
      onInventoryChange(inv);
      closeDbModal();
    }

    function getActsHistory() { return JSON.parse(localStorage.getItem('artmasters_acts_history') || '[]'); }
    function saveActToHistory(act) { const h = getActsHistory(); h.unshift(act); localStorage.setItem('artmasters_acts_history', JSON.stringify(h)); }

    function renderHistoryTable() {
      const tbody = document.getElementById('historyTableBody');
      tbody.innerHTML = '';
      const h = getActsHistory();
      if (h.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">История пуста</td></tr>'; return; }
      h.forEach(act => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><b>№ ${act.num}</b></td><td>${act.date}</td><td>${act.participant}</td><td><button class="select-btn" onclick="reprintAct('${act.num}')">🖨️ Печать</button></td>`;
        tbody.appendChild(tr);
      });
    }

    function reprintAct(actNum) {
      const act = getActsHistory().find(a => a.num === actNum);
      if (!act) return;
      document.getElementById('print-act-num').innerText = act.num;
      const printTbody = document.getElementById('print-table-tbody');
      printTbody.innerHTML = '';
      (act.items || [{inv: act.inv, name: act.name}]).forEach((item, idx) => {
        printTbody.innerHTML += `<tr><td>${idx+1}</td><td>${item.name}</td><td>${item.inv}</td><td>${act.participant}</td><td>${act.contact}</td><td>1</td><td>${act.date}</td><td>${act.returnDate}</td><td>${act.comment}</td></tr>`;
      });
      document.getElementById('act-print-area').classList.add('active-print');
      closeHistoryModal();
      window.print();
    }

    function generateAndPrintAct() {
      const currentInv = document.getElementById('inv-input').value.trim();
      const currentName = document.getElementById('equipment-name').value.trim();
      if (currentInv && currentName && !globalActItems.some(i => i.inv === currentInv)) {
        globalActItems.push({ inv: currentInv, name: currentName });
      }
      if (globalActItems.length === 0) {
        alert('Добавьте хотя бы одну позицию оборудования для печати Акта!');
        return;
      }

      const today = new Date().toLocaleDateString('ru-RU');
      const comp = document.getElementById('competence-select').value;
      const manager = document.getElementById('manager-select').value;
      const role = document.getElementById('recipient-role-select').value;
      const participant = getParticipantValue() || '—';
      const contact = getFullContactValue();
      const comment = document.getElementById('comment-input').value || '—';
      const rawDate = document.getElementById('return-date-input').value;
      let returnDate = document.getElementById('no-return-date-checkbox').checked ? '—' : (rawDate ? rawDate.split('-').reverse().join('.') : '—');

      const h = getActsHistory();
      const actNum = `2026-${String(h.length + 1).padStart(3, '0')}`;

      const printTbody = document.getElementById('print-table-tbody');
      printTbody.innerHTML = '';
      globalActItems.forEach((item, idx) => {
        printTbody.innerHTML += `<tr><td>${idx+1}</td><td>${item.name}</td><td>${item.inv}</td><td>${participant}</td><td>${contact}</td><td>1</td><td>${today}</td><td>${returnDate}</td><td>${comment}</td></tr>`;
      });

      saveActToHistory({ num: actNum, date: today, returnDate, items: globalActItems, comp, manager, role, participant, contact, comment });
      
      document.getElementById('act-print-area').classList.add('active-print');
      window.print();
      globalActItems = [];
      renderSelectedItems();
    }

    function downloadActWord() {
      generateAndPrintAct();
    }
    
    function printCallSheet() {
      window.print();
    }
  </script>
</body>
</html>
